name: Build and Push FHIR Service

on:
  push:
    branches:
      - develop # Change this to 'main' or your preferred default branch if needed
    paths:
      - 'fhir/**'
      - 'tomcat/**'
      - 'Dockerfile'
      - '.github/workflows/build-fhir.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./fhir/Dockerfile
          push: true
          tags: abertnamanya/openelis-global-2-fhir:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max